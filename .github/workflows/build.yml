# 构建并推送 Docker 镜像到 GitHub Container Registry 和 阿里云镜像站
#
# 触发方式:
#   - 推送到对应名称的分支自动构建镜像
#     例如: media-ai-base 分支 → 构建 media-ai-base 镜像
#   - 手动触发可选择镜像
#
# 需要配置的 Secrets:
#   - ALIYUN_CR_REGISTRY: 阿里云镜像站地址
#   - ALIYUN_CR_USERNAME: 阿里云镜像站用户名
#   - ALIYUN_CR_PASSWORD: 阿里云镜像站密码

name: Build Docker Images

on:
  push:
    branches:
      - media-ai-base
      - media-pull
  workflow_dispatch:
    inputs:
      image:
        description: "选择要构建的镜像"
        required: true
        type: choice
        options:
          - media-ai-base
          - media-pull

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image name
        id: image
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "name=${{ github.event.inputs.image }}" >> $GITHUB_OUTPUT
          else
              # 分支名即为镜像名
              echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Check image directory exists
        run: |
          if [ ! -d "images/${{ steps.image.outputs.name }}" ]; then
              echo "❌ 镜像目录不存在: images/${{ steps.image.outputs.name }}"
              exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_CR_REGISTRY }}
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from Dockerfile
        id: version
        run: |
          # 从 Dockerfile 的 LABEL version="x.x.x" 中提取版本号
          VERSION=$(grep -oP 'LABEL version="\K[^"]+' images/${{ steps.image.outputs.name }}/Dockerfile || echo "1.0.0")
          # 生成日期后缀 (YYYYMMDD)
          DATE=$(date +%Y%m%d)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_date=${VERSION}-${DATE}" >> $GITHUB_OUTPUT
          echo "📦 版本号: ${VERSION}, 完整标签: ${VERSION}-${DATE}"

      - name: Build and push ${{ steps.image.outputs.name }}
        uses: docker/build-push-action@v5
        with:
          context: images/${{ steps.image.outputs.name }}
          file: images/${{ steps.image.outputs.name }}/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:latest
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version_date }}
            ${{ secrets.ALIYUN_CR_REGISTRY }}/ali-docker-store/${{ steps.image.outputs.name }}:latest
            ${{ secrets.ALIYUN_CR_REGISTRY }}/ali-docker-store/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ secrets.ALIYUN_CR_REGISTRY }}/ali-docker-store/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version_date }}
          cache-from: type=gha,scope=${{ steps.image.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.name }}
