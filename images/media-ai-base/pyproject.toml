[project]
name = "media-ai"
version = "1.0.0"
description = "AI 语音识别与音频处理服务"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    
    # HTTP Client
    "requests>=2.32.0",
    
    # Logging
    "loguru>=0.7.0",
    
    # Audio/Video Processing
    "ffmpeg-python>=0.2.0",
    
    # Speech Recognition (Whisper)
    "faster-whisper>=1.2.0",
    
    # Audio Separation (GPU版，需要 onnxruntime-gpu)
    "audio-separator[gpu]>=0.18.0",
    "audio-separator[gpu]>=0.18.0",
    
    # 确保 numba 使用支持 Python 3.10 的版本
    "numba>=0.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio", "routes", "utils"]

# 强制 uv 使用 onnxruntime-gpu 替代 onnxruntime
# faster-whisper 依赖 onnxruntime，但我们需要 GPU 版本
[tool.uv]
override-dependencies = [
    "onnxruntime-gpu>=1.19.0",
]
